name: Admin Web CI

on:
  push:
    paths:
      - 'fe/admin/**'
      - '.github/workflows/admin-web.yml'
  pull_request:
    paths:
      - 'fe/admin/**'
      - '.github/workflows/admin-web.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe/admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fe/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build admin web
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:5000/api
          VITE_SOCKET_URL: http://127.0.0.1:5000

